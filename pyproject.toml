[project]
name = "business-to-development"
version = "1.0.0"
description = "Seven-agent AI workflow that turns business ideas into engineering blueprints"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.111,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "PyYAML>=6.0,<7",
  "sse-starlette>=2.1,<4",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
]

[tool.vercel]
entrypoint = "app:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"

